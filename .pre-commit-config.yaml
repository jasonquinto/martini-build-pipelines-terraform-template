ci:
  skip: []
  default_hook_settings: &default_hook
    always_run: true
    pass_filenames: false

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        <<: *default_hook
        files: ^terraform/.*\.tf$

      - id: terraform_validate
        <<: *default_hook
        files: ^terraform/.*\.tf$
        args:
          - --init-args=-lockfile=readonly
          - --args=-json
          - --args=-no-color

      - id: terraform_docs
        <<: *default_hook
        files: ^terraform/.*
        args:
          - --hook-config=--add-to-existing-file=true

      - id: terraform_checkov
        <<: *default_hook
        files: ^terraform/.*
        args:
          - --args=--directory=terraform
          - --args=--config-file=.checkov.yaml
          - --args=--quiet

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        pass_filenames: true
        always_run: false
        files: \.ya?ml$
        args:
          - --config-file=.yamllint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        pass_filenames: true
        always_run: false
        args: ["--severity=warning"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-1
    hooks:
      - id: shfmt
        pass_filenames: true
        always_run: false
        args:
          - "-w"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
        <<: *default_hook

      - id: trailing-whitespace
        <<: *default_hook

      - id: check-yaml
        <<: *default_hook

      - id: check-added-large-files
        <<: *default_hook

      - id: check-merge-conflict
        <<: *default_hook
