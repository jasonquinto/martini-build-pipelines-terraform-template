repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        always_run: true
        pass_filenames: false
        files: ^terraform/.*\.tf$

      - id: terraform_validate
        always_run: true
        pass_filenames: false
        files: ^terraform/.*\.tf$
        args:
          - --init-args=-lockfile=readonly
          - --args=-json
          - --args=-no-color

      - id: terraform_docs
        always_run: true
        pass_filenames: false
        files: ^terraform/.*
        args:
          - --hook-config=--add-to-existing-file=true

      - id: terraform_checkov
        always_run: true
        pass_filenames: false
        files: ^terraform/.*
        args:
          - --args=--directory=terraform
          - --args=--config-file=.checkov.yaml
          - --args=--quiet

  - repo: local
    hooks:
      - id: yamllint-local
        name: yamllint (local)
        entry: yamllint
        language: system
        pass_filenames: true
        always_run: false
        files: \.ya?ml$
        args:
          - --config-file=.yamllint

  - repo: local
    hooks:
      - id: shellcheck-local
        name: shellcheck (local)
        entry: shellcheck
        language: system
        pass_filenames: true
        files: \.sh$
        types_or: [shell]
        stages: [commit]
        args:
          - --severity=warning

  - repo: local
    hooks:
      - id: shfmt-local
        name: shfmt (local)
        entry: shfmt
        language: system
        pass_filenames: true
        files: \.sh$
        types_or: [shell]
        stages: [commit]
        args:
          - "-w"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
