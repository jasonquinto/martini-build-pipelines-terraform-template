---
name: Pre-Commit CI

on:
  push:
    branches:
      - main
      - development
  pull_request: {}

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.14"
      TOFU_VERSION: "1.10.7"
      TERRAFORM_DOCS_VERSION: "0.19.0"
      TOFU_ALLOW_UNSAFE_PLUGIN_DOWNLOADS: "1"
      CHECKOV_VERSION: "3.2.379"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Pre-commit Hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install Pre-commit
        run: pip install pre-commit

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "${{ env.TOFU_VERSION }}"

      - name: Install terraform-docs (required for tofu_docs)
        run: |
          curl -sSL https://github.com/terraform-docs/terraform-docs/releases/download/v${{ env.TERRAFORM_DOCS_VERSION }}/terraform-docs-v${{ env.TERRAFORM_DOCS_VERSION }}-linux-amd64.tar.gz -o terraform-docs.tar.gz
          tar -xzf terraform-docs.tar.gz
          sudo mv terraform-docs /usr/local/bin/terraform-docs
          sudo chmod +x /usr/local/bin/terraform-docs
          rm -f terraform-docs.tar.gz

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint shellcheck shfmt
          pip install checkov==${{ env.CHECKOV_VERSION }}

      - name: Run Pre-Commit Hooks
        run: pre-commit run --all-files --show-diff-on-failure
